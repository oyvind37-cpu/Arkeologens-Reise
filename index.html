<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0704">
<title>Arkeologens Reise 4.3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="intro" class="screen active">
    <div class="intro-bg"></div><div class="shade intro-shade"></div><div class="dust"></div>
    <button id="musicIntroBtn" class="music-intro" aria-label="Slå musikk av eller på">♫ MUSIKK PÅ</button>
    <div class="intro-quote">
      <div class="portrait"></div>
      <p>«Historien belønner tålmodighet. Se én gang til.»</p>
    </div>
    <button id="startBtn">START REISEN</button>
  </section>

  <audio id="musicTrack" src="mystisk_musikk.mp3" preload="auto" loop></audio>

  <section id="game" class="screen">
    <div id="world">
      <div class="temple-bg"></div><div class="sunbeam"></div><div class="mist"></div>
      <div class="ground"></div>
      <div class="pillar p1"></div><div class="pillar p2"></div><div class="pillar p3"></div>
      <div class="torch t1"><i></i></div><div class="torch t2"><i></i></div>

      <div id="pressurePlate" class="plate"></div>
      <div id="arrows" class="arrows"><i></i><i></i><i></i></div>

      <div id="eyeWall" class="eye-wall">
        <div id="eyeGlow" class="eye-glow"></div>
        <span class="eye-symbol">𓂀</span>
        <div id="wallDust" class="wall-dust"></div>
      </div>

      <div id="door" class="door"><span>𓂀</span></div>
      <div id="wowLight" class="wow-light"></div>

      <div id="aurora" class="aurora">
        <div class="shadow"></div>
        <div class="body">
          <div class="head"><div class="face"></div><div class="hair"></div><div class="blink"></div></div>
          <div class="neck"></div><div class="torso"></div><div class="scarf"></div><div class="backpack"></div>
          <div class="arm left-arm"></div><div class="arm right-arm"></div>
          <div class="leg left-leg"></div><div class="leg right-leg"></div>
          <div class="boot left-boot"></div><div class="boot right-boot"></div>
          <div class="hand-note">📓</div>
        </div>
      </div>
    </div>

    <button id="musicGameBtn" class="music-game" aria-label="Slå musikk av eller på">♫</button><div class="hud"><div><b>EGYPT</b><small>Kongenes dal</small></div><div><b id="objective">Finn inngangen</b><small id="progress">1 / 4</small></div></div>
    <div id="dialog" class="dialog"><div class="dialog-face"></div><div><b>AURORA</b><p id="dialogText">Vi tar det rolig. Gå mot høyre og se etter noe uvanlig.</p></div></div>

    <div id="nearHint" class="near-hint hidden">UNDERSØK HORUS-ØYET</div>

    <div class="controls">
      <div><button id="left">◀</button><button id="right">▶</button></div>
      <div><button id="vision">BLIKK</button><button id="jump">HOPP</button><button id="interact" class="primary">UNDERSØK</button></div>
    </div>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
