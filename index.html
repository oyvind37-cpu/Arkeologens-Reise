<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Arkeologens Reise 4.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<section id="intro" class="active">
  <div class="copy">
    <h1>ARKEOLOGENS REISE</h1>
    <p>Professor Aurora Vale og det tapte kompasset</p>
    <button id="start">START REISEN</button>
  </div>
</section>

<section id="hud" class="hidden">
  <span id="objective">Finn inngangen</span>
  <span id="progress">1 / 4</span>
</section>

<section id="dialog" class="hidden">
  <b>AURORA</b>
  <p id="dialogText"></p>
</section>

<section id="controls" class="hidden">
  <div>
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div>
    <button id="jump">HOPP</button>
    <button id="interact" class="primary">UNDERSØK</button>
  </div>
</section>

<script src="game.js"></script>
</body>
</html>
